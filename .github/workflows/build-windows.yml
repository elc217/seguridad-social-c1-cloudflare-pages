name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'version-unificada/**'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: version-unificada/package-lock.json

      - name: Install dependencies
        working-directory: ./version-unificada
        run: npm ci

      - name: Build Windows installer
        working-directory: ./version-unificada
        run: npm run build:win

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            version-unificada/dist/*.exe
            version-unificada/dist/*.blockmap
